name: QA API Automation Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-api:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Newman y reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Crear carpeta de reportes
        run: mkdir -p reports

      - name: Ejecutar pruebas de Postman
        run: |
          newman run qa_suite.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/index.html \
            --reporter-htmlextra-title "Reporte QA Reqres API"

      - name: Subir artefacto para Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Desplegar en GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
